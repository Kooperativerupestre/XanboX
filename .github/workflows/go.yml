name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          cat << 'EOF' > .env
          DATABASE_URL=postgres://xanbox:password@postgres:5432/xanbox?sslmode=disable
          TEST_DATABASE_URL=postgres://xanbox:password@test-postgres:5432/test_xanbox?sslmode=disable
          POSTGRES_DB=xanbox
          TEST_POSTGRES_DB=test_xanbox
          POSTGRES_PASSWORD=password
          POSTGRES_USER=xanbox
          EOF

      - name: Start test database
        run: docker compose up -d --wait test-postgres

      - name: Pre-pull container images
        run: |
          docker pull python:3.13
          docker pull golang:1.26

      - name: Run tests inside Docker
        run: |
          docker run --rm \
            --network xanbox_default \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/app \
            -w /app \
            -e TEST_DATABASE_URL="postgres://xanbox:password@test-postgres:5432/test_xanbox?sslmode=disable" \
            golang:1.26 \
            sh -c "go vet ./... && go test -v -race ./... && go build -v ./..."


